name: Check Mikachan Availability

on:
  schedule:
    - cron: '* */12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browsers (IMPORTANT)
      - name: Install Playwright browsers
        run: playwright install --with-deps

      # 5. Run script
      - name: Run script
        run: python check_mikachan.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      # 6. Commit state file if changed
      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add last_availability.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update availability state [skip ci]"
            git push
          fi
